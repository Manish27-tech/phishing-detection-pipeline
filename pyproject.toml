[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-detection-pipeline"
version = "0.1.0"
description = "Cost-sensitive phishing website detection with heuristic indicators and calibration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manish Pandey" }]
keywords = ["phishing", "cybersecurity", "machine-learning", "scikit-learn", "calibration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "joblib>=1.3",
  "streamlit>=1.36",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
phishing = "phishing.cli:main"

[project.urls]
Homepage = "https://github.com/Manish27-tech/phishing-detection-pipeline"
Repository = "https://github.com/Manish27-tech/phishing-detection-pipeline"
Issues = "https://github.com/Manish27-tech/phishing-detection-pipeline/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"dashboard/app.py" = ["E402"]
"tests/conftest.py" = ["E402"]
